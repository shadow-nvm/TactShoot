plugins {
    id 'com.android.application'
}

android {
    namespace = 'com.tactshoot.game'
    compileSdk = 36
    buildToolsVersion = '36.0.0'

    defaultConfig {
        applicationId = 'com.tactshoot.game'
        minSdk = 24
        targetSdk = 35
        versionCode = 1
        versionName = '1.0.0'
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            assets.srcDirs = ['../assets']
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    packaging {
        resources {
            excludes += ['META-INF/INDEX.LIST']
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            // To publish your own signed build, create a keystore and uncomment:
            // signingConfig = signingConfigs.create('release') {
            //     storeFile file('tactshoot.keystore')
            //     storePassword 'YOUR_STORE_PASSWORD'
            //     keyAlias 'tactshoot'
            //     keyPassword 'YOUR_KEY_PASSWORD'
            // }
        }
    }
}

// On-device touch checks: gradlew :android:emulatorCheck
// Installs the debug APK on a running (or freshly booted) emulator, drives real
// touch gestures and asserts joystick, look and fire behaviour from logcat.
tasks.register('emulatorCheck', Exec) {
    group = 'verification'
    description = 'Installs the debug APK on an emulator and verifies touch input.'
    dependsOn 'assembleDebug'
    workingDir rootProject.projectDir
    def pythonBin = System.getenv('PYTHON') ?: (System.getProperty('os.name')
            .toLowerCase().contains('windows') ? 'python' : 'python3')
    commandLine pythonBin, rootProject.file('tools/emulator_check.py').absolutePath,
            '--apk', layout.buildDirectory.file('outputs/apk/debug/android-debug.apk')
            .get().asFile.absolutePath
}

configurations { natives }

dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86_64"
    natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-x86"
    natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-x86_64"
}

// Extract natives at configuration/evaluation time so AGP sourceSets picks them up reliably
file("src/main/jniLibs").mkdirs()
try {
    configurations.natives.files.each { jar ->
        def outputDir = null
        if (jar.name.endsWith("natives-armeabi-v7a.jar")) outputDir = file("src/main/jniLibs/armeabi-v7a")
        if (jar.name.endsWith("natives-arm64-v8a.jar")) outputDir = file("src/main/jniLibs/arm64-v8a")
        if (jar.name.endsWith("natives-x86.jar")) outputDir = file("src/main/jniLibs/x86")
        if (jar.name.endsWith("natives-x86_64.jar")) outputDir = file("src/main/jniLibs/x86_64")
        if (outputDir != null) {
            outputDir.mkdirs()
            copy {
                from zipTree(jar)
                include "*.so"
                into outputDir
            }
        }
    }
} catch (Throwable t) {
    println "Natives extraction notice: " + t.message
}
