plugins {
    id 'application'
}

application {
    mainClass = 'com.tactshoot.game.desktop.DesktopLauncher'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
}

run {
    workingDir = rootProject.file('assets')
    setIgnoreExitValue(true)
}

// Temporary render smoke check, used by the agent verification pass.
tasks.register('smokeRender', JavaExec) {
    group = 'verification'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.tactshoot.game.desktop.SmokeMain'
    workingDir = rootProject.file('assets')
    systemProperty 'tactshoot.quality', System.getenv('TACTSHOOT_QUALITY') ?: '2'
    systemProperty 'tactshoot.mode', System.getenv('TACTSHOOT_MODE') ?: 'game'
    systemProperty 'tactshoot.out', rootProject.file('build/smoke').absolutePath
    setIgnoreExitValue(true)
}

tasks.withType(JavaExec).configureEach {
    if (System.getProperty('os.name').toLowerCase().contains('mac')) {
        jvmArgs += '-XstartOnFirstThread'
    }
}
